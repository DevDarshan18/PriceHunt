<div class="pager">
  <span class="pager__summary">{{ totalCount() }} results</span>

  <label class="pager__size">
    Rows
    <select [value]="pageSize()" (change)="changePageSize($event)">
      @for (size of pageSizes; track size) {
        <option [value]="size" [selected]="size === pageSize()">{{ size }}</option>
      }
    </select>
  </label>

  <button type="button" class="button" [disabled]="page() <= 1" (click)="pageChange.emit(page() - 1)">Previous</button>
  <span>Page {{ page() }} of {{ totalPages() }}</span>
  <button type="button" class="button" [disabled]="page() >= totalPages()" (click)="pageChange.emit(page() + 1)">Next</button>
</div>
